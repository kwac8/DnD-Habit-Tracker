<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DnD Habit Tracker</title>
</head>
<body>
    <div class="dashboard-container">

        <div class="character-card">
            <div class="character-display">
                <img id="characterPortrait" src="" alt="Character portrait">
            </div>
            <div class="character-stats">
                <p id="dexterity">Dexterity: 0</p>
                <p id="wisdom">Wisdom: 0</p>
                <p id="intelligence">Intelligence: 0</p>
                <p id="strength">Strength: 0</p>
            </div>

            <div class="character-info">
                <p id="name">Name: </p>
                <p id="playerClass">Class: </p>
                <p>Level: <span id="playerLevel">1</span></p>

            <div class="mana-container">
                <span class="mana-label">Mana:</span>
                <div class="mana-bar" id="manaBar">
                    <div id="manaDrain"></div>
                </div>
            </div>

            <div class="xp-container">
                <span class="xp-label">XP</span>
                <div class="xp-bar">
                    <div id="xpProgress"></div>
                </div>
            </div>

            <div class="hp-container">
                <span class="hp-label">HP</span>
                <div class="hp-bar"></div>
            </div>
                <p>Gold: <span id="playerGold">0</span></p>
            </div>
        </div>

        <div class="quests-page">
            <h2>Today's Quests:</h2>
            <div class="quests-list">
                <div class="quest-input-row">
                    <input type="text" id="questInput" placeholder="Start a quest...">
                    <button id="addQuestBtn">+</button>
                </div>
                <ul id="questList"></ul>
            </div>
        </div>

    </div>

    <div class="selection-window" id="selection-window">
        <label class="category-option">
            <input type="radio" name="category" value="Study">
            <span>Study/Work</span>
        </label>
        <br>
        <label class="class-option">
            <input type="radio" name="category" value="Train">
            <span>Train</span>
        </label>
        <br>
        <label class="class-option">
            <input type="radio" name="category" value="Read">
            <span>Read</span>
        </label>
        <br>
        <label class="class-option">
            <input type="radio" name="category" value="Clean">
            <span>Clean</span>
        </label>
        <br>
        <button id="confirmCategory" class="chooseBtn">Choose</button>
    </div>

    <script src="../data/classData.js"></script>
    <script src="index.js"></script>
</body>
</html>
